name: Daily Publish

# 北京 06:50 触发（UTC 22:50）。GitHub 的 schedule 在整点高峰期常延迟 15~45 分钟，
# 故不设整点，留 10 分钟余量以保证落在 07:00 附近。
# 本工作流跑在 GitHub 服务器上，与本机开关机 / WorkBuddy 客户端是否在线完全无关。
on:
  schedule:
    - cron: '50 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # runner 默认是 UTC，generate.py 用 date.today() 写 publish_date，
      # 不设 TZ 会把北京当天的文章标成前一天。
      TZ: Asia/Shanghai
    steps:
      # fetch-depth: 0 是必须的：默认浅克隆只拉最新 1 条提交，后面 pull --rebase
      # 与按提交历史做判断都会失真。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 幂等检查 - 今天是否已发布
        id: guard
        run: |
          TODAY=$(date +%F)
          # 判定依据是 topics.json 里有没有 publish_date == 今天的文章，
          # 而不是 git log —— git log 在浅克隆或历史被 rebase 过时会漏判，
          # 曾导致重复发布（2026-10-08 一天发两篇）。topics.json 是发布行为的唯一真相。
          ALREADY=$(python -c "import json,sys; ts=json.load(open('topics.json',encoding='utf-8'))['topics']; print('true' if any(t.get('publish_date')==sys.argv[1] for t in ts) else 'false')" "$TODAY")
          echo "skip=$ALREADY" >> "$GITHUB_OUTPUT"
          echo "今天($TODAY)已发布=$ALREADY"

      - name: 发布下一篇并重建全站
        if: steps.guard.outputs.skip == 'false'
        run: |
          python generate.py next
          python generate.py build

      - name: 提交并推送
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变更（可能是选题已耗尽），跳过提交"
            exit 0
          fi
          git commit -m "chore: daily publish $(date +%F)"
          # 期间若有人（本机流水线）推过，先 rebase 再推，避免 non-fast-forward 被拒
          git pull --rebase origin main
          git push origin main
          echo "已推送：chore: daily publish $(date +%F)"
