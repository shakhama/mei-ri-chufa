<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="twitter:card" content="summary_large_image">
{{HEAD_EXTRA}}
<style>
:root{--fg:#1f2328;--mut:#57606a;--bg:#fff;--line:#e6e8eb;--acc:#0a66c2;--soft:#f6f8fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
header.site{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:28px}
header.site a{color:var(--acc);text-decoration:none;font-weight:700}
h1{font-size:30px;line-height:1.3;margin:.2em 0 .4em}
h2{font-size:22px;margin:1.8em 0 .6em;border-left:4px solid var(--acc);padding-left:12px}
.meta{color:var(--mut);font-size:14px;margin-bottom:24px}
p{margin:.8em 0}
ul{padding-left:1.3em}li{margin:.35em 0}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0;background:var(--soft)}
.card a{color:var(--acc);font-weight:600;text-decoration:none;font-size:18px}
.card p{margin:.4em 0 0;color:var(--mut);font-size:14px}
.related{margin-top:48px;border-top:1px solid var(--line);padding-top:20px}
.related h3{font-size:18px}
.faq details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
.faq summary{cursor:pointer;font-weight:600}
footer{color:var(--mut);font-size:13px;border-top:1px solid var(--line);margin-top:56px;padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
{{BODY}}
<footer>© {{YEAR}} {{SITE_NAME}} · 由内容自动化引擎生成</footer>
</div>
</body>
</html>
